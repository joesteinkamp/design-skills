      6,starter,2,3,1,30,"asdf"

      7,pro,9,7,4,160,"Export is hidden in the new navigation"

      8,enterprise,26,9,5,205,"Scheduled exports would save my team hours"

      9,starter,4,5,2,150,"Filters reset, have to rebuild views daily"

      10,pro,16,10,5,180,"Works great"

      11,starter,1,2,1,140,"Couldn''t find export after the redesign"

